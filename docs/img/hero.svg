<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Asset Intelligence Copilot — animated pump jack">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset=".65" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#13203a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eab308" stop-opacity="0"/>
      <stop offset=".5" stop-color="#eab308"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".25" r=".9">
      <stop offset="0" stop-color="rgba(234,179,8,.35)"/>
      <stop offset="1" stop-color="rgba(234,179,8,0)"/>
    </radialGradient>
    <style>
      .beam{transform-origin:356px 150px;animation:beam 2.8s ease-in-out infinite}
      @keyframes beam{0%,100%{transform:rotate(3.6deg)}50%{transform:rotate(-3.6deg)}}
      .crank{transform-origin:512px 208px;animation:crank 2.8s linear infinite}
      @keyframes crank{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      .rod{animation:rod 2.8s ease-in-out infinite}
      @keyframes rod{0%,100%{transform:translateY(7px)}50%{transform:translateY(-7px)}}
      .drop{animation:drop 2.8s ease-in infinite}
      .drop.d2{animation-delay:1.4s}
      @keyframes drop{0%,58%{opacity:0;transform:translateY(0)}64%{opacity:1}100%{opacity:0;transform:translateY(44px)}}
      .glow{animation:glow 2.8s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.45}50%{opacity:.85}}
      .beacon{animation:beacon 2.2s steps(1) infinite}
      @keyframes beacon{0%,49%{opacity:1}50%,100%{opacity:.15}}
      .flow{stroke:url(#flow);stroke-width:3;fill:none;stroke-dasharray:160 840;animation:flowmove 4.5s linear infinite}
      @keyframes flowmove{from{stroke-dashoffset:1000}to{stroke-dashoffset:-1000}}
      .pip{animation:pip 3.2s ease-in-out infinite}
      @keyframes pip{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#sky)"/>

  <!-- derrick silhouettes on the horizon -->
  <g fill="#101b30">
    <path d="M760 262 L800 262 L826 120 L840 106 L854 120 L880 262 Z"/>
    <path d="M806 180 L846 180 M796 214 L856 214 M786 244 L866 244" stroke="#101b30" stroke-width="7"/>
    <rect x="952" y="196" width="120" height="66" rx="4"/>
    <rect x="976" y="160" width="18" height="38"/>
    <path d="M1080 262 L1136 262 L1152 140 L1164 128 L1176 140 L1192 262 Z"/>
  </g>
  <circle class="beacon" cx="840" cy="100" r="4" fill="#ef4444"/>
  <circle class="beacon" cx="1164" cy="122" r="3.4" fill="#ef4444" style="animation-delay:1.1s"/>
  <circle class="pip" cx="852" cy="132" r="2.4" fill="#eab308"/>

  <!-- headline -->
  <text x="600" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#f1f5f9" letter-spacing="1">Asset Intelligence Copilot</text>
  <text x="600" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#8fa3bd" letter-spacing=".5">Ask your oil field anything — it answers with receipts</text>
  <line class="flow" x1="240" y1="146" x2="960" y2="146"/>

  <!-- pump jack scene -->
  <ellipse class="glow" cx="356" cy="180" rx="170" ry="66" fill="url(#lamp)"/>
  <rect x="120" y="252" width="500" height="6" rx="3" fill="#1c2942"/>
  <rect x="170" y="247" width="330" height="8" rx="4" fill="#243550"/>

  <!-- wellhead -->
  <rect x="300" y="216" width="16" height="36" rx="3" fill="#31435f"/>
  <circle cx="308" cy="213" r="10" fill="#3d5375"/>

  <!-- derrick tower -->
  <path d="M262 252 L292 148 L304 148 L334 252" stroke="#2c3d59" stroke-width="8" fill="none" stroke-linejoin="round"/>
  <path d="M274 210 L322 210 M280 182 L316 182" stroke="#2c3d59" stroke-width="4"/>

  <!-- walking beam -->
  <g class="beam">
    <rect x="240" y="144" width="232" height="12" rx="6" fill="#43597d"/>
    <path d="M240 152 C218 152 214 174 228 186 L246 186 Z" fill="#eab308"/>
    <circle cx="356" cy="150" r="9" fill="#5b739c"/>
  </g>

  <!-- polished rod -->
  <g class="rod">
    <rect x="351" y="160" width="10" height="70" fill="#374b70"/>
  </g>

  <!-- crank + counterweight -->
  <g class="crank">
    <circle cx="512" cy="208" r="42" fill="none" stroke="#43597d" stroke-width="9"/>
    <circle cx="512" cy="208" r="7" fill="#5b739c"/>
    <rect x="544" y="190" width="22" height="36" rx="4" fill="#eab308"/>
    <rect x="512" y="202" width="56" height="11" rx="5" fill="#43597d"/>
  </g>

  <!-- motor -->
  <rect x="580" y="232" width="56" height="24" rx="5" fill="#31435f"/>
  <rect x="590" y="224" width="9" height="9" fill="#eab308" opacity=".75"/>

  <!-- oil drops from the wellhead -->
  <circle class="drop" cx="308" cy="226" r="5" fill="#eab308"/>
  <circle class="drop d2" cx="308" cy="226" r="3.6" fill="#c98d0b"/>

  <!-- chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="60" y="28" width="118" height="30" rx="15" fill="rgba(56,189,248,.12)" stroke="#23395b"/>
    <text x="119" y="48" text-anchor="middle" fill="#7dd3fc">evidence-backed</text>
    <rect x="186" y="28" width="128" height="30" rx="15" fill="rgba(234,179,8,.12)" stroke="#4a3d1a"/>
    <text x="250" y="48" text-anchor="middle" fill="#fbbf24">zero-hallucination</text>
  </g>
</svg>
